<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlexGap</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#6b6b70;--card:#f4f4f6;--open:#fbf1da;--acc:#e5a00d;--bd:#dcdce0}
@media(prefers-color-scheme:dark){:root{--bg:#18181a;--fg:#ececee;--mut:#9a9aa0;--card:#252528;--open:#33301f;--bd:#38383c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px}
h1{margin:0 0 16px}
.brand{background:#1c1c1e;border-radius:14px;padding:6px 18px;display:flex;justify-content:center}
.brand img{display:block;height:auto;width:min(100%,460px);max-width:100%;object-fit:contain}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
button.p{background:var(--acc);border-color:var(--acc);color:#111;font-weight:600;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:nowrap;margin:12px 0;align-items:center}
button:disabled{opacity:.4;cursor:default}
.row button,.row select{white-space:nowrap;flex:0 0 auto;padding:8px 12px}
.row #url{flex:1 1 120px;min-width:90px;width:0}
@media(max-width:700px){.row{flex-wrap:wrap}.row #url{flex-basis:100%}}
.bar{height:8px;background:var(--card);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0}
details{background:var(--card);border-radius:10px;margin:8px 0;padding:10px 14px;border-left:3px solid transparent}
details[open]{background:var(--open);border-left-color:var(--acc)}
.ignbox details[open]{background:transparent;border-left-color:transparent}
summary{cursor:pointer;font-weight:600}
.chk{background:transparent;border:0;padding:0 8px 0 0;font-size:1.15em;line-height:1;cursor:pointer;color:var(--acc)}
details.done{opacity:.55}
details.done>summary{text-decoration:line-through}
details.done>summary .chk{text-decoration:none}
summary span{color:var(--mut);font-weight:400}
ul{margin:8px 0 0;padding-left:0;list-style:none}
li{padding:2px 0;font-size:.95em}
code{background:var(--bg);padding:1px 6px;border-radius:4px}
.mut{color:var(--mut)}.err{color:#d33}
a{color:var(--acc)}
.stats{margin-top:28px;padding:14px 16px;background:var(--card);border-radius:10px;font-size:.92em}
.stats h2{font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 8px}
.stats{--ok:#3aa76d}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--bg);border-radius:8px;padding:10px 12px}
.tile b{display:block;font-size:1.6em;line-height:1.2}
.tile span{color:var(--mut);font-size:.82em}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bg)}
.split i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 14px;font-size:.85em;color:var(--mut)}
.legend em{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.top{display:grid;grid-template-columns:minmax(0,1fr) 2fr auto;gap:6px 10px;align-items:center;font-size:.88em}
.top .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .bar2{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.top .bar2 i{display:block;height:100%;background:var(--acc);border-radius:5px}
.top .c{font-weight:600;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{background:var(--bg);border-radius:14px;padding:2px 10px;font-size:.85em}
.chip b{color:var(--acc);margin-left:4px}
.cols{display:flex;gap:4px;align-items:flex-end;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.col{display:flex;flex-direction:column;align-items:center;min-width:18px;flex:1}
.col b{font-size:.7em;color:var(--mut);font-weight:400}
.col i{display:block;width:100%;max-width:34px;background:var(--acc);border-radius:3px 3px 0 0}
.col span{font-size:.7em;color:var(--mut);margin-top:3px}
.stats h3{margin-top:14px !important;font-size:.8em;color:var(--mut);margin:0 0 6px;font-weight:600}
.ignbox{margin-top:36px;padding-top:20px;border-top:2px solid var(--bd)}
.ignbox h2{font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 8px}
.ignbox details{background:transparent;border:1px dashed var(--bd)}
</style>
</head>
<body>
<main>
<h1 class="brand"><img src="/logo.webp?v=3" data-i18n-alt="h1alt" alt="PlexGap"></h1>
<div id="login"><button class="p" id="btnLogin" data-i18n="login">Mit Plex anmelden</button>
<p class="mut" id="loginMsg"></p></div>
<div id="app" hidden>
  <div class="row">
    <input id="url" data-i18n-ph="urlPh" placeholder="Serveradresse" style="font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)">
    <select id="server"></select>
    <select id="lib"></select>
    <button class="p" id="btnScan">Prüfen</button>
    <button id="btnStop" disabled data-i18n="stop">Stopp</button>
    <button id="btnClear" disabled data-i18n="clear">Löschen</button>
    <button id="btnLogout" data-i18n="logout">Abmelden</button>
  </div>
  <div class="bar" id="barWrap" hidden><i id="bar"></i></div>
  <p class="mut" id="status"></p>
  <div id="out"></div>
  <div id="ign"></div>
  <div id="stats"></div>
</div>
<p class="mut" style="margin-top:32px;font-size:.85em"><span id="ver"></span> · <select id="langSel" title="Language / Sprache" aria-label="Language / Sprache" style="padding:2px 6px;font-size:1em"></select></p>
</main>
<script>
const $=id=>document.getElementById(id);
let token=localStorage.getItem('plexToken')||'';
const api=async(p,o={})=>{
  const r=await fetch(p,{...o,headers:{'X-Token':token,'Content-Type':'application/json'}});
  const j=await r.json(); if(!r.ok) throw new Error(j.error||r.status); return j;
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');

// ---------- Mehrsprachigkeit (Reihenfolge der Texte: de, en, fr, es) ----------
const LANGS=[['de','Deutsch','de-DE'],['en','English','en-GB'],['fr','Français','fr-FR'],['es','Español','es-ES']];
const K={
h1alt:['PlexGap – fehlende Serienfolgen finden','PlexGap – find missing episodes','PlexGap – trouvez les épisodes manquants','PlexGap – encuentra los episodios que faltan'],
login:['Mit Plex anmelden','Sign in with Plex','Se connecter avec Plex','Iniciar sesión con Plex'],
loginStart:['Starte Anmeldung …','Starting sign-in …','Démarrage de la connexion …','Iniciando sesión …'],
loginOpen:['Bitte hier bei Plex anmelden:','Please sign in to Plex here:','Connectez-vous à Plex ici :','Inicia sesión en Plex aquí:'],
loginLink:['Plex-Anmeldung öffnen','Open Plex sign-in','Ouvrir la connexion Plex','Abrir inicio de sesión de Plex'],
loginWait:['Warte auf Bestätigung …','Waiting for confirmation …','En attente de confirmation …','Esperando confirmación …'],
loginTimeout:['Zeitüberschreitung, bitte erneut versuchen.','Timed out, please try again.','Délai dépassé, veuillez réessayer.','Tiempo agotado, inténtalo de nuevo.'],
urlPh:['Serveradresse','Server address','Adresse du serveur','Dirección del servidor'],
scan:['Prüfen','Scan','Analyser','Analizar'],
resume:['Fortsetzen','Resume','Reprendre','Continuar'],
newscan:['Neuer Scan','New scan','Nouvelle analyse','Nuevo análisis'],
stop:['Stopp','Stop','Arrêter','Detener'],
clear:['Löschen','Delete','Supprimer','Borrar'],
logout:['Abmelden','Sign out','Se déconnecter','Cerrar sesión'],
libLoad:['Lade …','Loading …','Chargement …','Cargando …'],
libNone:['Keine Serien-Bibliothek','No TV library','Aucune bibliothèque de séries','Sin biblioteca de series'],
libOff:['Server nicht erreichbar','Server unreachable','Serveur injoignable','Servidor no accesible'],
stopping:['Stoppe …','Stopping …','Arrêt en cours …','Deteniendo …'],
ignH:['Ausgeblendet','Hidden','Masquées','Ocultas'],
ignSum:['Ausgeblendete Serien','Hidden series','Séries masquées','Series ocultas'],
unhide:['Einblenden','Show again','Réafficher','Mostrar'],
unhideNote:['Serie eingeblendet – sie erscheint beim nächsten Lauf („{b}“) wieder in der Liste.','Series shown again – it will reappear in the list on the next run (“{b}”).','Série réaffichée – elle réapparaîtra dans la liste à la prochaine analyse (« {b} »).','Serie mostrada de nuevo: volverá a aparecer en la lista en el próximo análisis («{b}»).'],
savedStatus:['Gespeichertes Ergebnis vom {d}: {n} Serien mit fehlenden Folgen.','Saved result from {d}: {n} series with missing episodes.','Résultat enregistré du {d} : {n} séries avec des épisodes manquants.','Resultado guardado del {d}: {n} series con episodios que faltan.'],
partialStatus:[' (gestoppt, nur {p} Serien geprüft)',' (stopped, only {p} series checked)',' (arrêté, seulement {p} séries analysées)',' (detenido, solo {p} series analizadas)'],
confirmClear:['Gespeichertes Ergebnis komplett löschen?','Delete the saved result completely?','Supprimer complètement le résultat enregistré ?','¿Borrar por completo el resultado guardado?'],
chkOn:['Als erledigt abhaken','Mark as done','Marquer comme terminé','Marcar como hecho'],
chkOff:['Haken entfernen','Remove check mark','Retirer la coche','Quitar la marca'],
delTitle:['Dauerhaft ausblenden','Hide permanently','Masquer définitivement','Ocultar permanentemente'],
season:['Staffel {s}:','Season {s}:','Saison {s} :','Temporada {s}:'],
nMiss:['{n} fehlen','{n} missing','{n} manquants','faltan {n}'],
statH:['Statistik','Statistics','Statistiques','Estadísticas'],
tSeries:['Serien geprüft','series checked','séries analysées','series analizadas'],
tGaps:['mit fehlenden Folgen','with missing episodes','avec épisodes manquants','con episodios que faltan'],
tEps:['Folgen fehlen gesamt','episodes missing in total','épisodes manquants au total','episodios que faltan en total'],
tPct:['aller Folgen vorhanden','of all episodes present','de tous les épisodes présents','de todos los episodios presentes'],
tSize:['Speicher zu laden (geschätzt)','storage to download (estimated)','stockage à télécharger (estimé)','almacenamiento a descargar (estimado)'],
tNew:['neu (letzte 30 Tage)','new (last 30 days)','nouveaux (30 derniers jours)','nuevos (últimos 30 días)'],
hEps:['Vollständigkeit der Folgen','Episode completeness','Complétude des épisodes','Integridad de los episodios'],
aEps:['{h} von {t} Folgen vorhanden','{h} of {t} episodes present','{h} épisodes sur {t} présents','{h} de {t} episodios presentes'],
lEps:['{h} von {t} ausgestrahlten Folgen vorhanden','{h} of {t} aired episodes present','{h} épisodes diffusés sur {t} présents','{h} de {t} episodios emitidos presentes'],
hSer:['Vollständigkeit der Serien','Series completeness','Complétude des séries','Integridad de las series'],
aSer:['{c} vollständig, {g} mit Lücken','{c} complete, {g} with gaps','{c} complètes, {g} avec des manques','{c} completas, {g} con huecos'],
lComp:['Vollständig','Complete','Complètes','Completas'],
lGaps:['Mit Lücken','With gaps','Avec manques','Con huecos'],
lHid:['Ausgeblendet','Hidden','Masquées','Ocultas'],
hAlmost:['Fast fertig – höchstens 3 Folgen fehlen ({n})','Almost done – at most 3 episodes missing ({n})','Presque terminées – 3 épisodes manquants au plus ({n})','Casi completas: faltan como máximo 3 episodios ({n})'],
more:['+{n} weitere','+{n} more','+{n} autres','+{n} más'],
hSeasons:['Ganze Staffeln oder einzelne Lücken?','Whole seasons or single gaps?','Saisons entières ou manques isolés ?','¿Temporadas completas o huecos sueltos?'],
lFull:['Ganze Staffel fehlt','Whole season missing','Saison entière manquante','Falta la temporada entera'],
lSingle:['Nur einzelne Lücken','Only single gaps','Seulement des manques isolés','Solo huecos sueltos'],
hTop:['Die meisten fehlenden Folgen','Most missing episodes','Le plus d’épisodes manquants','Más episodios que faltan'],
hAge:['Alter der Lücken (nach Ausstrahlungsjahr)','Age of the gaps (by year aired)','Ancienneté des manques (par année de diffusion)','Antigüedad de los huecos (por año de emisión)'],
ageTitle:['{y}: {n} Folgen','{y}: {n} episodes','{y} : {n} épisodes','{y}: {n} episodios'],
hHist1:['Verlauf (1 Prüfung, zuletzt {d})','History (1 scan, latest {d})','Historique (1 analyse, dernière le {d})','Historial (1 análisis, último el {d})'],
hHistN:['Verlauf ({n} Prüfungen, zuletzt {d})','History ({n} scans, latest {d})','Historique ({n} analyses, dernière le {d})','Historial ({n} análisis, último el {d})'],
histAria:['Verlauf der fehlenden Folgen','Missing episodes over time','Évolution des épisodes manquants','Evolución de los episodios que faltan'],
delta:['Seit der Prüfung davor: <b>{c}</b> Folgen geschlossen, <b>{n}</b> neu hinzugekommen.','Since the previous scan: <b>{c}</b> episodes closed, <b>{n}</b> newly added.','Depuis l’analyse précédente : <b>{c}</b> épisodes comblés, <b>{n}</b> nouveaux.','Desde el análisis anterior: <b>{c}</b> episodios cerrados, <b>{n}</b> nuevos.'],
first:['Erste Prüfung im Verlauf – ab der nächsten siehst du Veränderungen.','First scan in the history – you will see changes from the next one on.','Première analyse de l’historique – les changements apparaîtront dès la suivante.','Primer análisis del historial: verás los cambios a partir del siguiente.'],
histClear:['Verlauf löschen','Delete history','Supprimer l’historique','Borrar historial'],
confirmHist:['Verlauf der Prüfungen löschen?','Delete the scan history?','Supprimer l’historique des analyses ?','¿Borrar el historial de análisis?'],
hDq:['Datenqualität','Data quality','Qualité des données','Calidad de los datos'],
dq1:['{n} Serie mit Hinweis (Zählung unsicher): {l}','{n} series with a note (count uncertain): {l}','{n} série avec remarque (décompte incertain) : {l}','{n} serie con aviso (recuento incierto): {l}'],
dqN:['{n} Serien mit Hinweis (Zählung unsicher): {l}','{n} series with a note (count uncertain): {l}','{n} séries avec remarque (décompte incertain) : {l}','{n} series con aviso (recuento incierto): {l}'],
verLine:['Version {v} · Auto-Update: {a}{s} · ','Version {v} · Auto-update: {a}{s} · ','Version {v} · Mise à jour auto : {a}{s} · ','Versión {v} · Actualización automática: {a}{s} · '],
unknown:['unbekannt','unknown','inconnue','desconocida'],
on:['an','on','activée','activada'],
off:['aus','off','désactivée','desactivada'],
updCheck:['Nach Update suchen','Check for updates','Rechercher une mise à jour','Buscar actualización'],
confirmUpd:['Neueste Version von GitHub laden? Eine laufende Prüfung wird dabei abgebrochen.','Load the latest version from GitHub? A running scan will be aborted.','Charger la dernière version depuis GitHub ? Une analyse en cours sera interrompue.','¿Descargar la última versión de GitHub? Un análisis en curso se cancelará.'],
updSearch:['Suche Update …','Looking for updates …','Recherche de mise à jour …','Buscando actualización …'],
updDone:['Aktualisiert, starte neu …','Updated, restarting …','Mis à jour, redémarrage …','Actualizado, reiniciando …'],
updFail:['Update fehlgeschlagen: {e}','Update failed: {e}','Échec de la mise à jour : {e}','Error al actualizar: {e}'],
// Meldungen des Servers (kommen auf Deutsch an und werden hier übersetzt)
srvNF:['Serie bei TVmaze nicht gefunden','Series not found on TVmaze','Série introuvable sur TVmaze','Serie no encontrada en TVmaze'],
srvCur:['Aktuell','Up to date','À jour','Actualizado'],
srvNoConn:['Keine Verbindung zum Plex-Server möglich','Cannot connect to the Plex server','Connexion au serveur Plex impossible','No se puede conectar con el servidor Plex'],
srvBadFiles:['Heruntergeladene Dateien sehen nicht richtig aus','Downloaded files do not look right','Les fichiers téléchargés semblent incorrects','Los archivos descargados no parecen correctos'],
srvErr:['Fehler: ','Error: ','Erreur : ','Error: '],
srvUpdFail:['Update fehlgeschlagen: ','Update failed: ','Échec de la mise à jour : ','Error al actualizar: '],
srvChkFail:['Update-Prüfung fehlgeschlagen: ','Update check failed: ','Échec de la recherche de mise à jour : ','Error al buscar actualizaciones: ']
};
const detect=()=>{const n=(navigator.language||'de').slice(0,2).toLowerCase();return LANGS.some(l=>l[0]===n)?n:'en'};
let lang=(()=>{try{const s=localStorage.getItem('lang');if(LANGS.some(l=>l[0]===s))return s}catch(e){}return detect()})();
const li=()=>Math.max(0,LANGS.findIndex(l=>l[0]===lang));
const loc=()=>LANGS[li()][2];
const t=(k,v)=>{let s=(K[k]||[k])[li()]??K[k][0];if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s};
// Servermeldungen (deutsch) in die gewählte Sprache übersetzen
const SRV_EXACT={'Serie bei TVmaze nicht gefunden':'srvNF','Aktuell':'srvCur','Keine Verbindung zum Plex-Server möglich':'srvNoConn','Heruntergeladene Dateien sehen nicht richtig aus':'srvBadFiles','Aktualisiert, starte neu …':'updDone'};
const SRV_PREFIX=[['Fehler: ','srvErr'],['Update fehlgeschlagen: ','srvUpdFail'],['Update-Prüfung fehlgeschlagen: ','srvChkFail']];
const srv=s=>{s=String(s==null?'':s);if(SRV_EXACT[s])return t(SRV_EXACT[s]);
  for(const [p,k] of SRV_PREFIX) if(s.startsWith(p)) return K[k][li()]+s.slice(p.length);return s};
const num=n=>Number(n).toLocaleString(loc());
const dec1=n=>Number(n).toLocaleString(loc(),{minimumFractionDigits:1,maximumFractionDigits:1});
// Dynamische Texte, die beim Sprachwechsel neu berechnet werden
let statusFn=null,loginFn=null,libMsg=null;
function setStatus(fn,html){statusFn=fn?{fn,html}:null;const s=$('status');if(!fn){s.textContent='';return}html?s.innerHTML=fn():s.textContent=fn()}
function setLogin(fn,html){loginFn=fn?{fn,html}:null;const s=$('loginMsg');if(!fn){s.textContent='';return}html?s.innerHTML=fn():s.textContent=fn()}
function setLibMsg(k){libMsg=k;if(k)$('lib').innerHTML=`<option value="">${esc(t(k))}</option>`}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>e.placeholder=t(e.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-alt]').forEach(e=>e.alt=t(e.dataset.i18nAlt));
  if(statusFn)setStatus(statusFn.fn,statusFn.html);
  if(loginFn)setLogin(loginFn.fn,loginFn.html);
  if(libMsg)setLibMsg(libMsg);
  if(typeof updateScanBtn==='function')updateScanBtn();
  if(typeof showVersion==='function')showVersion();
  if(typeof lastStatsJ!=='undefined'&&lastStatsJ){render(lastStatsJ,true);if(typeof showIgnored==='function'&&!$('app').hidden)showIgnored()}
}
$('langSel').innerHTML=LANGS.map(l=>`<option value="${l[0]}">${l[1]}</option>`).join('');
$('langSel').value=lang;
$('langSel').onchange=()=>{lang=$('langSel').value;try{localStorage.setItem('lang',lang)}catch(e){}applyLang()};

$('btnLogin').onclick=async()=>{
  try{
    setLogin(()=>t('loginStart'));
    const pin=await api('/api/pin',{method:'POST'});
    setLogin(()=>t('loginOpen')+' <a href="'+esc(pin.url)+'" target="_blank" rel="noopener">'+esc(t('loginLink'))+'</a><br>'+esc(t('loginWait')),true);
    try{window.open(pin.url,'_blank')}catch(e){}
    for(let i=0;i<120;i++){
      await new Promise(r=>setTimeout(r,2000));
      const r=await api(`/api/pin?id=${pin.id}&code=${pin.code}`);
      if(r.token){token=r.token;localStorage.setItem('plexToken',token);setLogin(null);return init();}
    }
    setLogin(()=>t('loginTimeout'));
  }catch(e){const m=e.message;setLogin(()=>'<span class="err">'+esc(srv(m))+'</span>',true)}
};
async function showVersion(){
  try{
    const v=await api('/api/version');
    $('ver').innerHTML=t('verLine',{v:esc(v.version||t('unknown')),a:v.auto?t('on'):t('off'),s:v.status?' · '+esc(srv(v.status)):''})+`<a href="#" id="btnUpd">${esc(t('updCheck'))}</a>`;
    $('btnUpd').onclick=async e=>{
      e.preventDefault();
      if(!confirm(t('confirmUpd'))) return;
      $('ver').textContent=t('updSearch');
      try{
        const r=await api('/api/update',{method:'POST'});
        if(r.updated){$('ver').textContent=t('updDone');setTimeout(()=>location.reload(),4000)}
        else showVersion();
      }catch(err){$('ver').textContent=t('updFail',{e:srv(err.message)})}
    };
  }catch(e){}
}
showVersion();
$('btnLogout').onclick=()=>{localStorage.removeItem('plexToken');token='';location.reload()};

async function init(){
  if(!token) return;
  try{
    await api('/api/servers'); // prüft, ob der Token gültig ist
    $('login').hidden=true;$('app').hidden=false;
    $('url').value=localStorage.getItem('plexUrl')||'http://192.168.2.20:32400';
    $('url').onchange=()=>{localStorage.setItem('plexUrl',$('url').value);loadLibs()};
    $('server').hidden=true;
    await loadLibs();
    await showLast();
  }catch(e){
    localStorage.removeItem('plexToken');token='';
    $('login').hidden=false;$('app').hidden=true;
    const m=e.message;setLogin(()=>'<span class="err">'+esc(srv(m))+'</span>',true);
  }
}
async function loadLibs(){
  setLibMsg('libLoad');
  try{
    const libs=await api('/api/libraries?url='+encodeURIComponent($('url').value));
    if(libs.length){libMsg=null;$('lib').innerHTML=libs.map(l=>`<option value="${esc(l.key)}">${esc(l.title)}</option>`).join('')}
    else setLibMsg('libNone');
  }catch(e){setLibMsg('libOff');const m=e.message;setStatus(()=>'<span class="err">'+esc(srv(m))+'</span>',true)}
  updateScanBtn();
}
$('btnScan').onclick=async()=>{
  if(!$('lib').value) return;
  const resume=canResume();
  if(isFinished()) await api('/api/last/clear',{method:'POST'}); // Neuer Scan: altes Ergebnis löschen
  scanning=true;
  if(!resume) $('out').innerHTML='';
  $('barWrap').hidden=false;$('btnScan').disabled=true;$('btnClear').disabled=true;
  const {id}=await api('/api/scan',{method:'POST',body:JSON.stringify({url:$('url').value,section:$('lib').value,resume})});
  $('btnStop').disabled=false;
  $('btnStop').onclick=async()=>{$('btnStop').disabled=true;setStatus(()=>t('stopping'));
    await api('/api/stop',{method:'POST',body:JSON.stringify({id})})};
  while(true){
    const j=await api('/api/job?id='+id);
    $('bar').style.width=(j.total?j.done/j.total*100:0)+'%';
    if(j.state==='error') setStatus(null); else setStatus(()=>`${j.done}/${j.total} – ${j.current}`);
    render(j,true);
    if(j.state==='error'){const m=j.error;setStatus(()=>'<span class="err">'+esc(srv(m))+'</span>',true);break}
    if(j.state==='done'){
      const n=j.results.filter(r=>r.missing.length).length;
      await showLast();break}
    await new Promise(r=>setTimeout(r,1000));
  }
  scanning=false;
  $('btnScan').disabled=false;$('barWrap').hidden=true;$('btnStop').disabled=true;
  $('btnClear').disabled=!(last&&last.results&&last.results.length);
};
let last=null,scanning=false;
const sameLib=()=>!!(last&&last.section&&String(last.section)===String($('lib').value));
const canResume=()=>sameLib()&&!!last.partial;   // gestoppter Lauf: weitermachen
const isFinished=()=>sameLib()&&!last.partial;   // durchgelaufen: Neuer Scan
const updateScanBtn=()=>{$('btnScan').textContent=t(canResume()?'resume':isFinished()?'newscan':'scan')};
$('lib').onchange=updateScanBtn;
async function showIgnored(){
  const l=await api('/api/ignored');
  $('ign').innerHTML=l.length?`<div class="ignbox"><h2>${esc(t('ignH'))}</h2><details><summary>${esc(t('ignSum'))} <span>${l.length}</span></summary><ul>${l.map(i=>
    `<li>${esc(i.title)} <button data-unhide="${esc(i.title)}" style="float:right;padding:0 8px">${esc(t('unhide'))}</button></li>`).join('')}</ul></details></div>`:'';
}
$('ign').onclick=async e=>{
  const b=e.target.closest('button[data-unhide]'); if(!b) return;
  e.preventDefault();
  const r=await api('/api/ignored/remove',{method:'POST',body:JSON.stringify({title:b.dataset.unhide})});
  const open=document.querySelector('#ign details');
  if(!scanning) await showLast();
  await showIgnored();
  const d=document.querySelector('#ign details'); if(d&&open) d.open=true;
  if(!scanning&&!r.restored) setStatus(()=>t('unhideNote',{b:t('resume')}));
};
async function showLast(){
  showIgnored();
  const d=await api('/api/last');
  try{hist=await api('/api/history')}catch(e){}
  try{doneSet=new Set(await api('/api/done'))}catch(e){}
  last=d;updateScanBtn();
  render(d,true);
  $('btnClear').disabled=scanning||!d.results.length;
  if(d.date) setStatus(()=>t('savedStatus',{d:new Date(d.date).toLocaleString(loc()),n:d.results.filter(r=>r.missing.length).length})+(d.partial?t('partialStatus',{p:d.partial}):''));
  else setStatus(null);
}
$('btnClear').onclick=async()=>{
  if(!confirm(t('confirmClear'))) return;
  await api('/api/last/clear',{method:'POST'});showLast();
};
let doneSet=new Set();
$('out').onclick=async e=>{
  const c=e.target.closest('button[data-done]');
  if(c){
    e.preventDefault();e.stopPropagation(); // Zeile nicht auf-/zuklappen
    const ttl=c.dataset.done,on=!doneSet.has(ttl);
    on?doneSet.add(ttl):doneSet.delete(ttl);
    c.textContent=on?'☑':'☐';c.setAttribute('aria-pressed',on);c.title=t(on?'chkOff':'chkOn');
    c.closest('details').classList.toggle('done',on);
    try{await api('/api/done',{method:'POST',body:JSON.stringify({title:ttl,done:on})})}catch(err){}
    return;
  }
  const b=e.target.closest('button[data-del]'); if(!b) return;
  e.preventDefault();
  await api('/api/last/remove',{method:'POST',body:JSON.stringify({title:b.dataset.del})});
  if(scanning) showIgnored(); else showLast(); // im Lauf aktualisiert die Abfrage die Liste selbst
};
let hist=[],lastStatsJ=null;
function fmtSize(b){
  const gb=b/1e9;
  if(gb>=1000) return (gb/1000).toLocaleString(loc(),{minimumFractionDigits:2,maximumFractionDigits:2})+' TB';
  if(gb>=10) return Math.round(gb)+' GB';
  return dec1(gb)+' GB';
}
function showStats(j){
  lastStatsJ=j;
  const agg=j.agg||{n:0,total:0,bytes:0,files:0};
  const res=j.results||[];
  const gaps=res.filter(r=>r.missing.length);
  const notes=res.filter(r=>r.note);
  if(!agg.n&&!res.length){$('stats').innerHTML='';return}
  const nSeries=Math.max(agg.n,gaps.length);
  const eps=gaps.reduce((a,r)=>a+r.missing.length,0);
  const hid=Math.min(agg.ign||0,Math.max(nSeries-gaps.length,0));
  const complete=nSeries-gaps.length-hid;
  const pct=n=>nSeries?n/nSeries*100:0;
  // Folgen insgesamt
  const total=agg.total,have=Math.max(total-eps,0),epPct=total?have/total*100:null;
  // Speicherbedarf: durchschnittliche Dateigröße der vorhandenen Folgen
  const globalBpe=agg.files?agg.bytes/agg.files:0;
  const size=gaps.reduce((a,r)=>a+r.missing.length*(r.bpe||globalBpe),0);
  // Alter der Lücken
  const lim=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
  const byYear={};let recent=0;
  gaps.forEach(r=>r.missing.forEach(m=>{const y=m.airdate.slice(0,4);byYear[y]=(byYear[y]||0)+1;if(m.airdate>=lim)recent++}));
  const years=Object.keys(byYear).sort().reverse(),maxY=Math.max(1,...years.map(y=>byYear[y]));
  // Fast fertig
  const almost=gaps.filter(r=>r.missing.length<=3).sort((a,b)=>a.missing.length-b.missing.length||a.title.localeCompare(b.title));
  // Ganze Staffeln
  const hasFs=gaps.length>0&&gaps.every(r=>r.fs!==undefined);
  const fullS=gaps.filter(r=>r.fs>0).length,onlyGaps=gaps.length-fullS;
  const pctG=n=>gaps.length?n/gaps.length*100:0;
  // Rangliste
  const top=[...gaps].sort((a,b)=>b.missing.length-a.missing.length).slice(0,5);
  const maxEp=top.length?top[0].missing.length:1;
  // Verlauf
  let trend='';
  if(hist.length){
    const last=hist[hist.length-1];
    let sp='';
    if(hist.length>=2){
      const vals=hist.map(h=>h.episodes),mx=Math.max(...vals,1),mn=Math.min(...vals);
      const pts=vals.map((v,i)=>[4+i*(192/(vals.length-1)),mx===mn?22:38-((v-mn)/(mx-mn))*32]);
      sp=`<svg viewBox="0 0 200 44" width="100%" height="44" role="img" aria-label="${esc(t('histAria'))}"><polyline fill="none" stroke="var(--acc)" stroke-width="2" points="${pts.map(p=>p.join(',')).join(' ')}"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3.5" fill="var(--acc)"/></svg>`;
    }
    const d=new Date(last.date).toLocaleDateString(loc());
    const delta=last.closed!==undefined
      ?t('delta',{c:num(last.closed),n:num(last.new)})
      :esc(t('first'));
    trend=`<h3>${esc(hist.length>1?t('hHistN',{n:hist.length,d}):t('hHist1',{d}))}</h3>${sp}<div class="mut" style="font-size:.88em">${delta} <a href="#" id="histClear">${esc(t('histClear'))}</a></div>`;
  }
  $('stats').innerHTML=`<div class="stats"><h2>${esc(t('statH'))}</h2>
    <div class="tiles">
      <div class="tile"><b>${num(nSeries)}</b><span>${esc(t('tSeries'))}</span></div>
      <div class="tile"><b>${num(gaps.length)}</b><span>${esc(t('tGaps'))}</span></div>
      <div class="tile"><b>${num(eps)}</b><span>${esc(t('tEps'))}</span></div>
      <div class="tile"><b>${epPct===null?'–':dec1(epPct)+' %'}</b><span>${esc(t('tPct'))}</span></div>
      <div class="tile"><b>${size?'≈ '+fmtSize(size):'–'}</b><span>${esc(t('tSize'))}</span></div>
      <div class="tile"><b>${num(recent)}</b><span>${esc(t('tNew'))}</span></div>
    </div>
    ${epPct!==null?`<h3>${esc(t('hEps'))}</h3><div class="split" role="img" aria-label="${esc(t('aEps',{h:num(have),t:num(total)}))}"><i style="width:${epPct}%;background:var(--ok)"></i></div>
    <div class="legend"><span>${esc(t('lEps',{h:num(have),t:num(total)}))}</span></div>`:''}
    <h3>${esc(t('hSer'))}</h3>
    <div class="split" role="img" aria-label="${esc(t('aSer',{c:complete,g:gaps.length}))}"><i style="width:${pct(complete)}%;background:var(--ok)"></i><i style="width:${pct(gaps.length)}%;background:var(--acc)"></i><i style="width:${pct(hid)}%;background:var(--mut);opacity:.5"></i></div>
    <div class="legend"><span><em style="background:var(--ok)"></em>${esc(t('lComp'))} ${complete} (${Math.round(pct(complete))} %)</span><span><em style="background:var(--acc)"></em>${esc(t('lGaps'))} ${gaps.length} (${Math.round(pct(gaps.length))} %)</span>${hid?`<span><em style="background:var(--mut);opacity:.5"></em>${esc(t('lHid'))} ${hid}</span>`:''}</div>
    ${almost.length?`<h3>${esc(t('hAlmost',{n:almost.length}))}</h3><div class="chips">${almost.slice(0,12).map(r=>`<span class="chip">${esc(r.title)} <b>${r.missing.length}</b></span>`).join('')}${almost.length>12?`<span class="chip mut">${esc(t('more',{n:almost.length-12}))}</span>`:''}</div>`:''}
    ${hasFs?`<h3>${esc(t('hSeasons'))}</h3>
    <div class="split"><i style="width:${pctG(fullS)}%;background:#d6584b"></i><i style="width:${pctG(onlyGaps)}%;background:var(--acc)"></i></div>
    <div class="legend"><span><em style="background:#d6584b"></em>${esc(t('lFull'))} ${fullS}</span><span><em style="background:var(--acc)"></em>${esc(t('lSingle'))} ${onlyGaps}</span></div>`:''}
    ${top.length?`<h3>${esc(t('hTop'))}</h3><div class="top">${top.map(r=>`<span class="n" title="${esc(r.title)}">${esc(r.title)}</span><div class="bar2"><i style="width:${r.missing.length/maxEp*100}%"></i></div><span class="c">${r.missing.length}</span>`).join('')}</div>`:''}
    ${years.length?`<h3>${esc(t('hAge'))}</h3><div class="cols">${years.map(y=>`<div class="col" title="${esc(t('ageTitle',{y,n:byYear[y]}))}"><b>${byYear[y]}</b><i style="height:${Math.max(4,byYear[y]/maxY*70)}px"></i><span>${years.length>8?"'"+y.slice(2):y}</span></div>`).join('')}</div>`:''}
    ${trend}
    ${notes.length?`<h3>${esc(t('hDq'))}</h3><div class="mut" style="font-size:.88em">${t(notes.length>1?'dqN':'dq1',{n:notes.length,l:notes.slice(0,6).map(r=>esc(r.title)).join(', ')+(notes.length>6?' …':'')})}</div>`:''}
  </div>`;
  const hc=$('histClear');
  if(hc) hc.onclick=async e=>{e.preventDefault();if(!confirm(t('confirmHist')))return;
    await api('/api/history/clear',{method:'POST'});hist=[];showStats(lastStatsJ)};
}
function render(j,deletable){
  showStats(j);
  const open=new Set([...document.querySelectorAll('details[open]')].map(d=>d.dataset.t));
  const rs=[...j.results].sort((a,b)=>a.title.localeCompare(b.title));
  $('out').innerHTML=rs.map(r=>{
    const bySeason={};r.missing.forEach(m=>(bySeason[m.s]??=[]).push(m));
    const body=r.missing.length?Object.entries(bySeason).map(([s,l])=>
      `<li><b>${esc(t('season',{s}))}</b> ${esc(t('nMiss',{n:l.length}))}<ul>${l.map(m=>`<li><code>S${pad(m.s)}E${pad(m.e)}</code> ${esc(m.name)} <span class="mut">(${m.airdate})</span></li>`).join('')}</ul></li>`).join('')
      :'';
    const dn=doneSet.has(r.title);
    return `<details data-t="${esc(r.title)}"${open.has(r.title)?' open':''}${dn?' class="done"':''}><summary><button class="chk" data-done="${esc(r.title)}" title="${esc(t(dn?'chkOff':'chkOn'))}" aria-pressed="${dn}">${dn?'☑':'☐'}</button>${esc(r.title)} <span>${r.missing.length?esc(t('nMiss',{n:r.missing.length})):''}${r.note?' – '+esc(srv(r.note)):''}</span>${deletable?` <button data-del="${esc(r.title)}" title="${esc(t('delTitle'))}" style="float:right;padding:0 8px">✕</button>`:''}</summary><ul>${body}</ul></details>`;
  }).join('');
}
applyLang();
init();
</script>
</body>
</html>
