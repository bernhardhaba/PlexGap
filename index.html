<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlexGap</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#6b6b70;--card:#f4f4f6;--open:#fbf1da;--acc:#e5a00d;--bd:#dcdce0}
@media(prefers-color-scheme:dark){:root{--bg:#18181a;--fg:#ececee;--mut:#9a9aa0;--card:#252528;--open:#33301f;--bd:#38383c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px}
h1{margin:0 0 16px}
.brand{background:#1c1c1e;border-radius:14px;padding:6px 18px;display:flex;justify-content:center}
.brand img{display:block;height:auto;width:min(100%,460px);max-width:100%;object-fit:contain}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
button.p{background:var(--acc);border-color:var(--acc);color:#111;font-weight:600;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
.bar{height:8px;background:var(--card);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0}
details{background:var(--card);border-radius:10px;margin:8px 0;padding:10px 14px;border-left:3px solid transparent}
details[open]{background:var(--open);border-left-color:var(--acc)}
.ignbox details[open]{background:transparent;border-left-color:transparent}
summary{cursor:pointer;font-weight:600}
.chk{background:transparent;border:0;padding:0 8px 0 0;font-size:1.15em;line-height:1;cursor:pointer;color:var(--acc)}
details.done{opacity:.55}
details.done>summary{text-decoration:line-through}
details.done>summary .chk{text-decoration:none}
summary span{color:var(--mut);font-weight:400}
ul{margin:8px 0 0;padding-left:0;list-style:none}
li{padding:2px 0;font-size:.95em}
code{background:var(--bg);padding:1px 6px;border-radius:4px}
.mut{color:var(--mut)}.err{color:#d33}
a{color:var(--acc)}
.stats{margin-top:28px;padding:14px 16px;background:var(--card);border-radius:10px;font-size:.92em}
.stats h2{font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 8px}
.stats{--ok:#3aa76d}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--bg);border-radius:8px;padding:10px 12px}
.tile b{display:block;font-size:1.6em;line-height:1.2}
.tile span{color:var(--mut);font-size:.82em}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bg)}
.split i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 14px;font-size:.85em;color:var(--mut)}
.legend em{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.top{display:grid;grid-template-columns:minmax(0,1fr) 2fr auto;gap:6px 10px;align-items:center;font-size:.88em}
.top .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .bar2{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.top .bar2 i{display:block;height:100%;background:var(--acc);border-radius:5px}
.top .c{font-weight:600;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{background:var(--bg);border-radius:14px;padding:2px 10px;font-size:.85em}
.chip b{color:var(--acc);margin-left:4px}
.cols{display:flex;gap:4px;align-items:flex-end;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.col{display:flex;flex-direction:column;align-items:center;min-width:18px;flex:1}
.col b{font-size:.7em;color:var(--mut);font-weight:400}
.col i{display:block;width:100%;max-width:34px;background:var(--acc);border-radius:3px 3px 0 0}
.col span{font-size:.7em;color:var(--mut);margin-top:3px}
.stats h3{margin-top:14px !important;font-size:.8em;color:var(--mut);margin:0 0 6px;font-weight:600}
.ignbox{margin-top:36px;padding-top:20px;border-top:2px solid var(--bd)}
.ignbox h2{font-size:.8em;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 8px}
.ignbox details{background:transparent;border:1px dashed var(--bd)}
</style>
</head>
<body>
<main>
<h1 class="brand"><img src="/logo.webp?v=3" alt="PlexGap – fehlende Serienfolgen finden"></h1>
<div id="login"><button class="p" id="btnLogin">Mit Plex anmelden</button>
<p class="mut" id="loginMsg"></p></div>
<div id="app" hidden>
  <div class="row">
    <input id="url" placeholder="Serveradresse" size="26" style="font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)">
    <select id="server"></select>
    <select id="lib"></select>
    <button class="p" id="btnScan">Prüfen</button>
    <button id="btnStop" hidden>Stopp</button>
    <button id="btnClear" hidden>Ergebnis löschen</button>
    <button id="btnLogout">Abmelden</button>
  </div>
  <div class="bar" id="barWrap" hidden><i id="bar"></i></div>
  <p class="mut" id="status"></p>
  <div id="out"></div>
  <div id="ign"></div>
  <div id="stats"></div>
</div>
<p class="mut" id="ver" style="margin-top:32px;font-size:.85em"></p>
</main>
<script>
const $=id=>document.getElementById(id);
let token=localStorage.getItem('plexToken')||'';
const api=async(p,o={})=>{
  const r=await fetch(p,{...o,headers:{'X-Token':token,'Content-Type':'application/json'}});
  const j=await r.json(); if(!r.ok) throw new Error(j.error||r.status); return j;
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');

$('btnLogin').onclick=async()=>{
  try{
    $('loginMsg').textContent='Starte Anmeldung …';
    const pin=await api('/api/pin',{method:'POST'});
    $('loginMsg').innerHTML='Bitte hier bei Plex anmelden: <a href="'+esc(pin.url)+'" target="_blank" rel="noopener">Plex-Anmeldung öffnen</a><br>Warte auf Bestätigung …';
    try{window.open(pin.url,'_blank')}catch(e){}
    for(let i=0;i<120;i++){
      await new Promise(r=>setTimeout(r,2000));
      const r=await api(`/api/pin?id=${pin.id}&code=${pin.code}`);
      if(r.token){token=r.token;localStorage.setItem('plexToken',token);return init();}
    }
    $('loginMsg').textContent='Zeitüberschreitung, bitte erneut versuchen.';
  }catch(e){$('loginMsg').innerHTML='<span class="err">'+esc(e.message)+'</span>'}
};
async function showVersion(){
  try{
    const v=await api('/api/version');
    $('ver').innerHTML=`Version ${esc(v.version||'unbekannt')} · Auto-Update: ${v.auto?'an':'aus'}${v.status?' · '+esc(v.status):''} · <a href="#" id="btnUpd">Nach Update suchen</a>`;
    $('btnUpd').onclick=async e=>{
      e.preventDefault();
      if(!confirm('Neueste Version von GitHub laden? Eine laufende Prüfung wird dabei abgebrochen.')) return;
      $('ver').textContent='Suche Update …';
      try{
        const r=await api('/api/update',{method:'POST'});
        if(r.updated){$('ver').textContent='Aktualisiert, starte neu …';setTimeout(()=>location.reload(),4000)}
        else showVersion();
      }catch(err){$('ver').textContent='Update fehlgeschlagen: '+err.message}
    };
  }catch(e){}
}
showVersion();
$('btnLogout').onclick=()=>{localStorage.removeItem('plexToken');token='';location.reload()};

async function init(){
  if(!token) return;
  try{
    await api('/api/servers'); // prüft, ob der Token gültig ist
    $('login').hidden=true;$('app').hidden=false;
    $('url').value=localStorage.getItem('plexUrl')||'http://192.168.2.20:32400';
    $('url').onchange=()=>{localStorage.setItem('plexUrl',$('url').value);loadLibs()};
    $('server').hidden=true;
    await loadLibs();
    await showLast();
  }catch(e){
    localStorage.removeItem('plexToken');token='';
    $('login').hidden=false;$('app').hidden=true;
    $('loginMsg').innerHTML='<span class="err">'+esc(e.message)+'</span>';
  }
}
async function loadLibs(){
  $('lib').innerHTML='<option>Lade …</option>';
  try{
    const libs=await api('/api/libraries?url='+encodeURIComponent($('url').value));
    $('lib').innerHTML=libs.length?libs.map(l=>`<option value="${esc(l.key)}">${esc(l.title)}</option>`).join(''):'<option value="">Keine Serien-Bibliothek</option>';
  }catch(e){$('lib').innerHTML='<option value="">Server nicht erreichbar</option>';$('status').innerHTML='<span class="err">'+esc(e.message)+'</span>'}
  updateScanBtn();
}
$('btnScan').onclick=async()=>{
  if(!$('lib').value) return;
  const resume=canResume();scanning=true;
  if(!resume) $('out').innerHTML='';
  $('barWrap').hidden=false;$('btnScan').disabled=true;
  const {id}=await api('/api/scan',{method:'POST',body:JSON.stringify({url:$('url').value,section:$('lib').value,resume})});
  $('btnStop').hidden=false;$('btnStop').disabled=false;
  $('btnStop').onclick=async()=>{$('btnStop').disabled=true;$('status').textContent='Stoppe …';
    await api('/api/stop',{method:'POST',body:JSON.stringify({id})})};
  while(true){
    const j=await api('/api/job?id='+id);
    $('bar').style.width=(j.total?j.done/j.total*100:0)+'%';
    $('status').textContent=j.state==='error'?'':`${j.done}/${j.total} – ${j.current}`;
    render(j,true);
    if(j.state==='error'){$('status').innerHTML='<span class="err">'+esc(j.error)+'</span>';break}
    if(j.state==='done'){
      const n=j.results.filter(r=>r.missing.length).length;
      await showLast();break}
    await new Promise(r=>setTimeout(r,1000));
  }
  scanning=false;
  $('btnScan').disabled=false;$('barWrap').hidden=true;$('btnStop').hidden=true;
};
let last=null,scanning=false;
const canResume=()=>!!(last&&last.section&&String(last.section)===String($('lib').value));
const updateScanBtn=()=>{$('btnScan').textContent=canResume()?'Fortsetzen':'Prüfen'};
$('lib').onchange=updateScanBtn;
async function showIgnored(){
  const l=await api('/api/ignored');
  $('ign').innerHTML=l.length?`<div class="ignbox"><h2>Ausgeblendet</h2><details><summary>Ausgeblendete Serien <span>${l.length}</span></summary><ul>${l.map(i=>
    `<li>${esc(i.title)} <button data-unhide="${esc(i.title)}" style="float:right;padding:0 8px">Einblenden</button></li>`).join('')}</ul></details></div>`:'';
}
$('ign').onclick=async e=>{
  const b=e.target.closest('button[data-unhide]'); if(!b) return;
  e.preventDefault();
  const r=await api('/api/ignored/remove',{method:'POST',body:JSON.stringify({title:b.dataset.unhide})});
  const open=document.querySelector('#ign details');
  if(!scanning) await showLast();
  await showIgnored();
  const d=document.querySelector('#ign details'); if(d&&open) d.open=true;
  if(!scanning&&!r.restored) $('status').textContent='Serie eingeblendet – sie erscheint beim nächsten Lauf („Fortsetzen“) wieder in der Liste.';
};
async function showLast(){
  showIgnored();
  const d=await api('/api/last');
  try{hist=await api('/api/history')}catch(e){}
  try{doneSet=new Set(await api('/api/done'))}catch(e){}
  last=d;updateScanBtn();
  render(d,true);
  $('btnClear').hidden=!d.results.length;
  $('status').textContent=d.date?`Gespeichertes Ergebnis vom ${new Date(d.date).toLocaleString('de-DE')}: ${d.results.filter(r=>r.missing.length).length} Serien mit fehlenden Folgen.`+(d.partial?` (gestoppt, nur ${d.partial} Serien geprüft)`:''):'';
}
$('btnClear').onclick=async()=>{
  if(!confirm('Gespeichertes Ergebnis komplett löschen?')) return;
  await api('/api/last/clear',{method:'POST'});showLast();
};
let doneSet=new Set();
$('out').onclick=async e=>{
  const c=e.target.closest('button[data-done]');
  if(c){
    e.preventDefault();e.stopPropagation(); // Zeile nicht auf-/zuklappen
    const t=c.dataset.done,on=!doneSet.has(t);
    on?doneSet.add(t):doneSet.delete(t);
    c.textContent=on?'☑':'☐';c.setAttribute('aria-pressed',on);c.title=on?'Haken entfernen':'Als erledigt abhaken';
    c.closest('details').classList.toggle('done',on);
    try{await api('/api/done',{method:'POST',body:JSON.stringify({title:t,done:on})})}catch(err){}
    return;
  }
  const b=e.target.closest('button[data-del]'); if(!b) return;
  e.preventDefault();
  await api('/api/last/remove',{method:'POST',body:JSON.stringify({title:b.dataset.del})});
  if(scanning) showIgnored(); else showLast(); // im Lauf aktualisiert die Abfrage die Liste selbst
};
let hist=[],lastStatsJ=null;
const num=n=>Number(n).toLocaleString('de-DE');
function fmtSize(b){
  const gb=b/1e9;
  if(gb>=1000) return (gb/1000).toFixed(2).replace('.',',')+' TB';
  if(gb>=10) return Math.round(gb)+' GB';
  return gb.toFixed(1).replace('.',',')+' GB';
}
function showStats(j){
  lastStatsJ=j;
  const agg=j.agg||{n:0,total:0,bytes:0,files:0};
  const res=j.results||[];
  const gaps=res.filter(r=>r.missing.length);
  const notes=res.filter(r=>r.note);
  if(!agg.n&&!res.length){$('stats').innerHTML='';return}
  const nSeries=Math.max(agg.n,gaps.length);
  const eps=gaps.reduce((a,r)=>a+r.missing.length,0);
  const hid=Math.min(agg.ign||0,Math.max(nSeries-gaps.length,0));
  const complete=nSeries-gaps.length-hid;
  const pct=n=>nSeries?n/nSeries*100:0;
  // Folgen insgesamt
  const total=agg.total,have=Math.max(total-eps,0),epPct=total?have/total*100:null;
  // Speicherbedarf: durchschnittliche Dateigröße der vorhandenen Folgen
  const globalBpe=agg.files?agg.bytes/agg.files:0;
  const size=gaps.reduce((a,r)=>a+r.missing.length*(r.bpe||globalBpe),0);
  // Alter der Lücken
  const lim=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
  const byYear={};let recent=0;
  gaps.forEach(r=>r.missing.forEach(m=>{const y=m.airdate.slice(0,4);byYear[y]=(byYear[y]||0)+1;if(m.airdate>=lim)recent++}));
  const years=Object.keys(byYear).sort().reverse(),maxY=Math.max(1,...years.map(y=>byYear[y]));
  // Fast fertig
  const almost=gaps.filter(r=>r.missing.length<=3).sort((a,b)=>a.missing.length-b.missing.length||a.title.localeCompare(b.title));
  // Ganze Staffeln
  const hasFs=gaps.length>0&&gaps.every(r=>r.fs!==undefined);
  const fullS=gaps.filter(r=>r.fs>0).length,onlyGaps=gaps.length-fullS;
  const pctG=n=>gaps.length?n/gaps.length*100:0;
  // Rangliste
  const top=[...gaps].sort((a,b)=>b.missing.length-a.missing.length).slice(0,5);
  const maxEp=top.length?top[0].missing.length:1;
  // Verlauf
  let trend='';
  if(hist.length){
    const last=hist[hist.length-1];
    let sp='';
    if(hist.length>=2){
      const vals=hist.map(h=>h.episodes),mx=Math.max(...vals,1),mn=Math.min(...vals);
      const pts=vals.map((v,i)=>[4+i*(192/(vals.length-1)),mx===mn?22:38-((v-mn)/(mx-mn))*32]);
      sp=`<svg viewBox="0 0 200 44" width="100%" height="44" role="img" aria-label="Verlauf der fehlenden Folgen"><polyline fill="none" stroke="var(--acc)" stroke-width="2" points="${pts.map(p=>p.join(',')).join(' ')}"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3.5" fill="var(--acc)"/></svg>`;
    }
    const d=new Date(last.date).toLocaleDateString('de-DE');
    const delta=last.closed!==undefined
      ?`Seit der Prüfung davor: <b>${num(last.closed)}</b> Folgen geschlossen, <b>${num(last.new)}</b> neu hinzugekommen.`
      :'Erste Prüfung im Verlauf – ab der nächsten siehst du Veränderungen.';
    trend=`<h3>Verlauf (${hist.length} Prüfung${hist.length>1?'en':''}, zuletzt ${d})</h3>${sp}<div class="mut" style="font-size:.88em">${delta} <a href="#" id="histClear">Verlauf löschen</a></div>`;
  }
  $('stats').innerHTML=`<div class="stats"><h2>Statistik</h2>
    <div class="tiles">
      <div class="tile"><b>${num(nSeries)}</b><span>Serien geprüft</span></div>
      <div class="tile"><b>${num(gaps.length)}</b><span>mit fehlenden Folgen</span></div>
      <div class="tile"><b>${num(eps)}</b><span>Folgen fehlen gesamt</span></div>
      <div class="tile"><b>${epPct===null?'–':epPct.toFixed(1).replace('.',',')+' %'}</b><span>aller Folgen vorhanden</span></div>
      <div class="tile"><b>${size?'≈ '+fmtSize(size):'–'}</b><span>Speicher zu laden (geschätzt)</span></div>
      <div class="tile"><b>${num(recent)}</b><span>neu (letzte 30 Tage)</span></div>
    </div>
    ${epPct!==null?`<h3>Vollständigkeit der Folgen</h3><div class="split" role="img" aria-label="${num(have)} von ${num(total)} Folgen vorhanden"><i style="width:${epPct}%;background:var(--ok)"></i></div>
    <div class="legend"><span>${num(have)} von ${num(total)} ausgestrahlten Folgen vorhanden</span></div>`:''}
    <h3>Vollständigkeit der Serien</h3>
    <div class="split" role="img" aria-label="${complete} vollständig, ${gaps.length} mit Lücken"><i style="width:${pct(complete)}%;background:var(--ok)"></i><i style="width:${pct(gaps.length)}%;background:var(--acc)"></i><i style="width:${pct(hid)}%;background:var(--mut);opacity:.5"></i></div>
    <div class="legend"><span><em style="background:var(--ok)"></em>Vollständig ${complete} (${Math.round(pct(complete))} %)</span><span><em style="background:var(--acc)"></em>Mit Lücken ${gaps.length} (${Math.round(pct(gaps.length))} %)</span>${hid?`<span><em style="background:var(--mut);opacity:.5"></em>Ausgeblendet ${hid}</span>`:''}</div>
    ${almost.length?`<h3>Fast fertig – höchstens 3 Folgen fehlen (${almost.length})</h3><div class="chips">${almost.slice(0,12).map(r=>`<span class="chip">${esc(r.title)} <b>${r.missing.length}</b></span>`).join('')}${almost.length>12?`<span class="chip mut">+${almost.length-12} weitere</span>`:''}</div>`:''}
    ${hasFs?`<h3>Ganze Staffeln oder einzelne Lücken?</h3>
    <div class="split"><i style="width:${pctG(fullS)}%;background:#d6584b"></i><i style="width:${pctG(onlyGaps)}%;background:var(--acc)"></i></div>
    <div class="legend"><span><em style="background:#d6584b"></em>Ganze Staffel fehlt ${fullS}</span><span><em style="background:var(--acc)"></em>Nur einzelne Lücken ${onlyGaps}</span></div>`:''}
    ${top.length?`<h3>Die meisten fehlenden Folgen</h3><div class="top">${top.map(r=>`<span class="n" title="${esc(r.title)}">${esc(r.title)}</span><div class="bar2"><i style="width:${r.missing.length/maxEp*100}%"></i></div><span class="c">${r.missing.length}</span>`).join('')}</div>`:''}
    ${years.length?`<h3>Alter der Lücken (nach Ausstrahlungsjahr)</h3><div class="cols">${years.map(y=>`<div class="col" title="${y}: ${byYear[y]} Folgen"><b>${byYear[y]}</b><i style="height:${Math.max(4,byYear[y]/maxY*70)}px"></i><span>${years.length>8?"'"+y.slice(2):y}</span></div>`).join('')}</div>`:''}
    ${trend}
    ${notes.length?`<h3>Datenqualität</h3><div class="mut" style="font-size:.88em">${notes.length} Serie${notes.length>1?'n':''} mit Hinweis (Zählung unsicher): ${notes.slice(0,6).map(r=>esc(r.title)).join(', ')}${notes.length>6?' …':''}</div>`:''}
  </div>`;
  const hc=$('histClear');
  if(hc) hc.onclick=async e=>{e.preventDefault();if(!confirm('Verlauf der Prüfungen löschen?'))return;
    await api('/api/history/clear',{method:'POST'});hist=[];showStats(lastStatsJ)};
}
function render(j,deletable){
  showStats(j);
  const open=new Set([...document.querySelectorAll('details[open]')].map(d=>d.dataset.t));
  const rs=[...j.results].sort((a,b)=>a.title.localeCompare(b.title));
  $('out').innerHTML=rs.map(r=>{
    const bySeason={};r.missing.forEach(m=>(bySeason[m.s]??=[]).push(m));
    const body=r.missing.length?Object.entries(bySeason).map(([s,l])=>
      `<li><b>Staffel ${s}:</b> ${l.length} fehlen<ul>${l.map(m=>`<li><code>S${pad(m.s)}E${pad(m.e)}</code> ${esc(m.name)} <span class="mut">(${m.airdate})</span></li>`).join('')}</ul></li>`).join('')
      :'';
    const dn=doneSet.has(r.title);
    return `<details data-t="${esc(r.title)}"${open.has(r.title)?' open':''}${dn?' class="done"':''}><summary><button class="chk" data-done="${esc(r.title)}" title="${dn?'Haken entfernen':'Als erledigt abhaken'}" aria-pressed="${dn}">${dn?'☑':'☐'}</button>${esc(r.title)} <span>${r.missing.length?r.missing.length+' fehlen':''}${r.note?' – '+esc(r.note):''}</span>${deletable?` <button data-del="${esc(r.title)}" title="Dauerhaft ausblenden" style="float:right;padding:0 8px">✕</button>`:''}</summary><ul>${body}</ul></details>`;
  }).join('');
}
init();
</script>
</body>
</html>
